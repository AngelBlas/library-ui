<h2 mat-dialog-title>Book</h2>
<mat-dialog-content>
  <form id="book-form" [formRoot]="categoryForm.$form" (submit)="operate()">
    <div hidden="true">
      <mat-form-field>
        <mat-label>ID</mat-label>
        <input matInput placeholder="Id" [formField]="categoryForm.$form.categoryId" />
      </mat-form-field>
    </div>
    <mat-form-field>
      <mat-label>Name</mat-label>
      <input matInput placeholder="Id" [formField]="categoryForm.$form.name" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>DEscription</mat-label>
      <input matInput placeholder="Id" [formField]="categoryForm.$form.description" />
    </mat-form-field>
    <mat-slide-toggle
      [checked]="categoryForm.$form.status().value() === 'A'"
      (change)="categoryForm.$form.status().value.set($event.checked ? 'A' : 'I')"
      (blur)="categoryForm.$form.status().markAsTouched()"
    >
      {{ categoryForm.$form.status().value() === 'A' ? 'Activo' : 'Inactivo' }}
    </mat-slide-toggle>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button class="cancel-button" mat-flat-button mat-dialog-close type="button">
    <span>Cancel</span>
    <mat-icon>Cancel</mat-icon>
  </button>
  <button
    matButton="outlined"
    cdkFocusInitial
    type="submit"
    form="book-form"
    [disabled]="categoryForm.$isInvalid()"
  >
    <span>Acepted</span>
    <mat-icon>Check Circle</mat-icon>
  </button>
</mat-dialog-actions>
